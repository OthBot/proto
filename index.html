<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chez Mme Kinda – Ustensiles de cuisine</title>
<style>
:root{--bg:#e9eeec;--fg:#1c2624;--card:#fbfcfb;--acc:#1f5f5b;--acc-fg:#fff;--bd:#cfd9d6;--mut:#5a6865;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191a;--fg:#e8eeec;--card:#1d2425;--acc:#5fc2b8;--acc-fg:#0d1716;--bd:#2f3b3c;--mut:#9aa9a6}}
:root[data-theme="dark"]{--bg:#14191a;--fg:#e8eeec;--card:#1d2425;--acc:#5fc2b8;--acc-fg:#0d1716;--bd:#2f3b3c;--mut:#9aa9a6}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:.55rem .9rem}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.main{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:600}
#bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:calc(.7rem + env(safe-area-inset-top,0px)) .9rem .7rem;pointer-events:none}
#bar>*{pointer-events:auto}
#bar h1{margin:0;font:600 1.15rem Georgia,"Times New Roman",serif;background:var(--card);padding:.45rem .8rem;border-radius:8px;border:1px solid var(--bd)}
#bar div{display:flex;gap:.5rem}
#hint{position:fixed;left:50%;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);padding:.4rem .8rem;border-radius:8px;font-size:.85rem;color:var(--mut);max-width:90vw;text-align:center;transition:opacity .6s}
#pad{position:fixed;right:.9rem;bottom:calc(.9rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.5rem}
#pad button{width:3.2rem;height:3.2rem;font-size:1.2rem;padding:0;touch-action:none;user-select:none}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:var(--card);border-top:1px solid var(--bd);padding:1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s}
#panel.open{transform:none}
@media (min-width:720px){#panel{left:auto;top:0;width:24rem;max-height:none;border-left:1px solid var(--bd);border-top:0;transform:translateX(105%)}#panel.open{transform:none}}
#panel h2{margin:0 0 .3rem;font:600 1.3rem Georgia,"Times New Roman",serif}
#panel p{margin:.3rem 0 .8rem;color:var(--mut);line-height:1.5}
.price{font-weight:700;font-size:1.1rem;margin:.2rem 0 .9rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--bd)}
.row small{color:var(--mut);display:block}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
@media (prefers-reduced-motion:reduce){#panel,#hint{transition:none}}
</style>
</head>

const fmt=n=>n.toLocaleString("fr-FR")+" FCFA";

/* Scène */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef0ef);
const camera=new THREE.PerspectiveCamera(70,1,.1,60);
camera.position.set(0,1.6,2.8);camera.rotation.order="YXZ";
renderer.outputEncoding=THREE.sRGBEncoding;
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const add=(g,m,x,y,z,p=scene)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o};
scene.add(new THREE.HemisphereLight(0xffffff,0xc4cac8,1.2));
const sun=new THREE.DirectionalLight(0xffffff,.4);sun.position.set(2,6,3);scene.add(sun);
const floor=add(new THREE.PlaneGeometry(10,10),mat(0xd8dcdb,.3),0,0,0);floor.rotation.x=-Math.PI/2;
const ceil=add(new THREE.PlaneGeometry(10,10),mat(0xffffff),0,3.5,0);ceil.rotation.x=Math.PI/2;
const wm=new THREE.MeshStandardMaterial({color:0xf3f4f3,roughness:.95,side:THREE.DoubleSide});
add(new THREE.PlaneGeometry(10,3.5),wm,0,1.75,-5);add(new THREE.PlaneGeometry(10,3.5),wm,0,1.75,5);
[-5,5].forEach(x=>{const w=add(new THREE.PlaneGeometry(10,3.5),wm,x,1.75,0);w.rotation.y=Math.PI/2});
function label(n,pr){const c=document.createElement("canvas");c.width=1000;c.height=200;const k=c.getContext("2d");
  k.fillStyle="#fff";k.fillRect(0,0,1000,200);k.textAlign="center";k.textBaseline="middle";
  k.fillStyle="#1b1f1f";k.font="700 56px system-ui,sans-serif";k.fillText(n,500,70);
  k.fillStyle="#1f5f5b";k.font="600 50px system-ui,sans-serif";k.fillText(pr,500,145);
  const x=new THREE.CanvasTexture(c);x.encoding=THREE.sRGBEncoding;x.anisotropy=8;return x}
const loader=new THREE.TextureLoader(),meshes=[],PI=Math.PI;
const SLOTS=[{x:-1.6,z:-4.95,r:0},{x:1.6,z:-4.95,r:0},{x:-4.95,z:-2,r:PI/2},{x:-4.95,z:2,r:PI/2},{x:4.95,z:-2,r:-PI/2},{x:4.95,z:2,r:-PI/2}];
PRODUCTS.forEach((p,i)=>{
  const s=SLOTS[i],g=new THREE.Group();g.position.set(s.x,0,s.z);g.rotation.y=s.r;scene.add(g);
  add(new THREE.BoxGeometry(2.3,2.3,.06),mat(0x1b1f1f,.5),0,1.9,0,g);
  const t=loader.load(p.img);t.encoding=THREE.sRGBEncoding;
  const im=add(new THREE.PlaneGeometry(2.14,2.14),new THREE.MeshBasicMaterial({map:t}),0,1.9,.04,g);
  im.userData.id=p.id;meshes.push(im);
  add(new THREE.PlaneGeometry(2.2,.44),new THREE.MeshBasicMaterial({map:label(p.n,fmt(p.p))}),0,.5,.035,g);
});

/* Contrôles */
let yaw=0,pitch=0;const keys={};
const map={ArrowUp:"f",KeyW:"f",KeyZ:"f",ArrowDown:"b",KeyS:"b",ArrowLeft:"l",KeyA:"l",KeyQ:"l",ArrowRight:"r",KeyD:"r"};
addEventListener("keydown",e=>{if(map[e.code])keys[map[e.code]]=1});
addEventListener("keyup",e=>{if(map[e.code])keys[map[e.code]]=0});
[["#fw","f"],["#bk","b"]].forEach(([s,k])=>{const b=$(s);
  b.addEventListener("pointerdown",e=>{keys[k]=1;b.setPointerCapture(e.pointerId)});
  ["pointerup","pointercancel"].forEach(t=>b.addEventListener(t,()=>keys[k]=0))});
const cv=renderer.domElement;let down=null;
cv.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,m:0}});
cv.addEventListener("pointermove",e=>{if(!down)return;
  const dx=e.clientX-down.x,dy=e.clientY-down.y;
  if(Math.abs(dx)+Math.abs(dy)>4)down.m=1;
  yaw-=dx*.005;pitch=Math.max(-1,Math.min(1,pitch-dy*.005));down.x=e.clientX;down.y=e.clientY});
cv.addEventListener("pointerup",e=>{if(down&&!down.m)pick(e);down=null});
cv.addEventListener("pointerleave",()=>down=null);
const ray=new THREE.Raycaster();
function pick(e){
  ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},camera);
  const h=ray.intersectObjects(meshes)[0];
  if(h)showProduct(h.object.userData.id);else closePanel();
}

/* Interface */
const panel=$("#panel");
const open=h=>{panel.innerHTML=h;panel.classList.add("open");$("#hint").style.opacity=0};
function closePanel(){panel.classList.remove("open")}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function sync(){$("#bCart").textContent="Panier ("+count()+")"}
let plan=1;
const tr=(t,n)=>fmt(Math.ceil(t/n));
function showProduct(id){
  const p=PRODUCTS.find(x=>x.id===id);
  open(`<img src="${p.img}" alt="${p.n}" style="width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin-bottom:.6rem"><h2>${p.n}</h2><p>${p.d}</p><div class="price">${fmt(p.p)}</div><p>Paiement en plusieurs tranches possible, par exemple 3 × ${tr(p.p,3)}.</p>
  <div class="acts"><button class="main" data-add="${id}">Ajouter au panier</button><button data-close>Fermer</button></div>`);
}
function showList(){
  open(`<h2>Tous les produits</h2>`+PRODUCTS.map(p=>`<div class="row"><div>${p.n}<small>${fmt(p.p)}</small></div><div class="acts" style="margin:0"><button data-view="${p.id}">Voir</button><button class="main" data-add="${p.id}">Ajouter</button></div></div>`).join("")+`<div class="acts"><button data-close>Fermer</button></div>`);
}
function showCart(msg){
  const ids=Object.keys(cart).filter(k=>cart[k]>0);
  if(!ids.length){open(`<h2>Panier</h2><p>Votre panier est vide. Approchez-vous d’un mur et touchez un produit pour l’ajouter.</p><div class="acts"><button data-close>Continuer la visite</button></div>`);return}
  let total=0;
  const rows=ids.map(k=>{const p=PRODUCTS.find(x=>x.id==k),q=cart[k];total+=p.p*q;
    return `<div class="row"><div>${p.n}<small>${fmt(p.p)} × ${q}</small></div><div class="acts" style="margin:0"><button data-dec="${k}" aria-label="Retirer un">−</button><button data-add="${k}" aria-label="Ajouter un">+</button></div></div>`}).join("");
  const plans=[1,2,3,4].map(n=>`<button class="${n===plan?"main":""}" data-plan="${n}">${n===1?"Comptant":n+" tranches"}</button>`).join("");
  open(`<h2>Panier</h2>${rows}<div class="price" style="margin-top:.9rem">Total : ${fmt(total)}</div>
  <p>Mode de paiement</p><div class="acts" style="margin-top:0">${plans}</div>
  ${plan>1?`<p>${plan} tranches de ${tr(total,plan)}. Le calendrier des tranches sera confirmé par la boutique.</p>`:""}${msg?`<p>${msg}</p>`:""}
  <div class="acts"><button class="main" data-order>Commander</button><button data-close>Continuer la visite</button></div>`);
}
panel.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if("close" in d)closePanel();
  else if(d.view)showProduct(+d.view);
  else if(d.plan){plan=+d.plan;showCart()}
  else if(d.add){cart[d.add]=(cart[d.add]||0)+1;sync();
    if(panel.querySelector("[data-order]"))showCart();else{b.textContent="Ajouté ✓"}}
  else if(d.dec){cart[d.dec]=Math.max(0,cart[d.dec]-1);sync();showCart()}
  else if("order" in d)showCart("Ceci est un prototype : la commande sera reliée au stock et au paiement à l’étape suivante.");
});
$("#bList").onclick=showList;
$("#bCart").onclick=()=>showCart();
setTimeout(()=>$("#hint").style.opacity=0,9000);

/* Boucle */
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
let last=performance.now();
(function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  const f=(keys.f?1:0)-(keys.b?1:0),s=(keys.r?1:0)-(keys.l?1:0);
  if(f||s){
    const sp=2.4*dt,px=camera.position.x,pz=camera.position.z;
    let x=px+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,z=pz+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
    x=Math.max(-3.4,Math.min(3.4,x));z=Math.max(-3,Math.min(4,z));
    camera.position.x=x;camera.position.z=z;
  }
  camera.rotation.set(pitch,yaw,0);
  renderer.render(scene,camera);requestAnimationFrame(loop);
})(last);
</script>
